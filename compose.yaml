
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Définir AUTH_JWT_SECRET dans .env}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:3001}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PRODUCTS_REDIS_HOST: ${PRODUCTS_REDIS_HOST:-redis}

    ports:
      - "3000:3000"

    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/.env:/app/.env:ro
      - backend_uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/docs-json').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./Frontend-cross-platform/webfront
      dockerfile: Dockerfile
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LUNETTY_API_PROXY_TARGET: http://backend:3000
      DATABASE_URL: ""

    ports:
      - "3001:3000"

    volumes:
      - ./Frontend-cross-platform/webfront/app:/app/app
      - ./Frontend-cross-platform/webfront/contexts:/app/contexts
      - ./Frontend-cross-platform/webfront/lib:/app/lib
      - ./Frontend-cross-platform/webfront/public:/app/public
      - ./Frontend-cross-platform/webfront/services:/app/services

    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?Définir POSTGRES_DB dans .env}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  backend_uploads:
  postgres_data:
