
name: Security Analysis

on:
  push:
    branches:
      - kouki
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Semgrep, Trivy and DefectDojo
    runs-on: [self-hosted, Windows, X64, lunetty]
    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    steps:
      # --------------------------------------------------
      # 1. RECUPERATION DU CODE
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null

      # --------------------------------------------------
      # 2. VERIFICATION DES OUTILS
      # --------------------------------------------------
      - name: Check Docker
        run: |
          docker version
          docker compose version

      # --------------------------------------------------
      # 3. SEMGREP - SAST
      # --------------------------------------------------
      - name: Semgrep scan
        run: |
          docker run --rm `
            -v "${env:GITHUB_WORKSPACE}:/src" `
            -w /src `
            semgrep/semgrep:1.182.1 `
            semgrep scan `
            --config auto `
            --json `
            --output reports/semgrep-report.json

      # --------------------------------------------------
      # 4. TRIVY - FILESYSTEM
      # --------------------------------------------------
      - name: Trivy filesystem scan
        run: |
          docker run --rm `
            -v "${env:GITHUB_WORKSPACE}:/project" `
            -v trivy-cache:/root/.cache `
            aquasec/trivy:0.76.2 `
            fs `
            --scanners vuln,secret,misconfig `
            --skip-dirs defectdojo `
            --skip-dirs node_modules `
            --skip-dirs .next `
            --skip-dirs .git `
            --skip-dirs reports `
            --timeout 15m `
            --format json `
            --output /project/reports/trivy-filesystem.json `
            /project

      # --------------------------------------------------
      # 5. BUILD DOCKER IMAGES
      # --------------------------------------------------
      - name: Build backend Docker image
        run: |
          docker build `
            -t lunetty-backend:security `
            -f backend/Dockerfile `
            backend

      - name: Build frontend Docker image
        run: |
          docker build `
            -t lunetty-frontend:security `
            -f Frontend-cross-platform/webfront/Dockerfile `
            Frontend-cross-platform/webfront

      # --------------------------------------------------
      # 6. EXPORT DOCKER IMAGES
      # --------------------------------------------------
      - name: Save Docker images
        run: |
          docker save `
            -o reports/backend-image.tar `
            lunetty-backend:security

          docker save `
            -o reports/frontend-image.tar `
            lunetty-frontend:security

      # --------------------------------------------------
      # 7. TRIVY - BACKEND IMAGE
      # --------------------------------------------------
      - name: Trivy backend image scan
        run: |
          docker run --rm `
            -v "${env:GITHUB_WORKSPACE}:/project" `
            -v trivy-cache:/root/.cache `
            aquasec/trivy:0.76.2 `
            image `
            --input /project/reports/backend-image.tar `
            --scanners vuln,secret,misconfig `
            --timeout 15m `
            --format json `
            --output /project/reports/trivy-backend.json

      # --------------------------------------------------
      # 8. TRIVY - FRONTEND IMAGE
      # --------------------------------------------------
      - name: Trivy frontend image scan
        run: |
          docker run --rm `
            -v "${env:GITHUB_WORKSPACE}:/project" `
            -v trivy-cache:/root/.cache `
            aquasec/trivy:0.76.2 `
            image `
            --input /project/reports/frontend-image.tar `
            --scanners vuln,secret,misconfig `
            --timeout 15m `
            --format json `
            --output /project/reports/trivy-frontend.json

      # --------------------------------------------------
      # 9. IMPORT SEMGREP INTO DEFECTDOJO
      # --------------------------------------------------
      - name: Import Semgrep into DefectDojo
        if: always() && hashFiles('reports/semgrep-report.json') != ''
        run: |
          curl.exe --fail-with-body -X POST `
            "$env:DEFECTDOJO_URL/api/v2/reimport-scan/" `
            -H "Authorization: Token $env:DEFECTDOJO_API_TOKEN" `
            -F "file=@reports/semgrep-report.json" `
            -F "scan_type=Semgrep JSON Report" `
            -F "product_type_name=Lunetty Applications" `
            -F "product_name=Lunetty" `
            -F "engagement_name=GitHub Actions Security" `
            -F "test_title=Semgrep - Lunetty" `
            -F "auto_create_context=true"
        env:
          DEFECTDOJO_URL: ${{ vars.DEFECTDOJO_URL }}
          DEFECTDOJO_API_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}

      # --------------------------------------------------
      # 10. IMPORT TRIVY FILESYSTEM INTO DEFECTDOJO
      # --------------------------------------------------
      - name: Import Trivy filesystem into DefectDojo
        if: always() && hashFiles('reports/trivy-filesystem.json') != ''
        run: |
          curl.exe --fail-with-body -X POST `
            "$env:DEFECTDOJO_URL/api/v2/reimport-scan/" `
            -H "Authorization: Token $env:DEFECTDOJO_API_TOKEN" `
            -F "file=@reports/trivy-filesystem.json" `
            -F "scan_type=Trivy Scan" `
            -F "product_type_name=Lunetty Applications" `
            -F "product_name=Lunetty" `
            -F "engagement_name=GitHub Actions Security" `
            -F "test_title=Trivy Filesystem - Lunetty" `
            -F "auto_create_context=true"
        env:
          DEFECTDOJO_URL: ${{ vars.DEFECTDOJO_URL }}
          DEFECTDOJO_API_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}

      # --------------------------------------------------
      # 11. IMPORT TRIVY BACKEND INTO DEFECTDOJO
      # --------------------------------------------------
      - name: Import Trivy backend into DefectDojo
        if: always() && hashFiles('reports/trivy-backend.json') != ''
        run: |
          curl.exe --fail-with-body -X POST `
            "$env:DEFECTDOJO_URL/api/v2/reimport-scan/" `
            -H "Authorization: Token $env:DEFECTDOJO_API_TOKEN" `
            -F "file=@reports/trivy-backend.json" `
            -F "scan_type=Trivy Scan" `
            -F "product_type_name=Lunetty Applications" `
            -F "product_name=Lunetty" `
            -F "engagement_name=GitHub Actions Security" `
            -F "test_title=Trivy Backend Image - Lunetty" `
            -F "auto_create_context=true"
        env:
          DEFECTDOJO_URL: ${{ vars.DEFECTDOJO_URL }}
          DEFECTDOJO_API_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}

      # --------------------------------------------------
      # 12. IMPORT TRIVY FRONTEND INTO DEFECTDOJO
      # --------------------------------------------------
      - name: Import Trivy frontend into DefectDojo
        if: always() && hashFiles('reports/trivy-frontend.json') != ''
        run: |
          curl.exe --fail-with-body -X POST `
            "$env:DEFECTDOJO_URL/api/v2/reimport-scan/" `
            -H "Authorization: Token $env:DEFECTDOJO_API_TOKEN" `
            -F "file=@reports/trivy-frontend.json" `
            -F "scan_type=Trivy Scan" `
            -F "product_type_name=Lunetty Applications" `
            -F "product_name=Lunetty" `
            -F "engagement_name=GitHub Actions Security" `
            -F "test_title=Trivy Frontend Image - Lunetty" `
            -F "auto_create_context=true"
        env:
          DEFECTDOJO_URL: ${{ vars.DEFECTDOJO_URL }}
          DEFECTDOJO_API_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}

      # --------------------------------------------------
      # 13. UPLOAD REPORTS TO GITHUB
      # --------------------------------------------------
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunetty-security-reports
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30
